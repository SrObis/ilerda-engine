name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Compilar
        run: dotnet build -c Release src/Ilerda
      # perft, claus Zobrist i signatura del bench (nodes de `bench 12`)
      - name: Suite de proves
        run: dotnet run -c Release --no-build --project src/Ilerda -- test
