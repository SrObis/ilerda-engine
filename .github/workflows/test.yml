name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Compilar
        run: dotnet build -c Release src/Ilerda
      # perft, claus Zobrist i signatura del bench (nodes de `bench 12`)
      - name: Suite de proves
        run: dotnet run -c Release --no-build --project src/Ilerda -- test
      # executable autocontingut de Linux, el mateix que publica tools/publicar.ps1
      - name: Executable de Linux
        run: |
          dotnet publish src/Ilerda -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -o dist
          ./dist/Ilerda test
          (printf 'uci\nisready\nposition startpos\ngo depth 10\n'; sleep 10; echo quit) | timeout 60 ./dist/Ilerda > sortida.txt
          grep '^info depth 10 ' sortida.txt
          grep '^bestmove ' sortida.txt
